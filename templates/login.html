<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 50% 50%, rgba(99, 102, 241, 0.12) 0px, transparent 60%);
        }
        .login-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-brand-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-glow);
        }
        .login-brand h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .login-brand p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }
        .demo-credentials {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .demo-credentials code {
            color: var(--accent-cyan);
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-brand">
            <div class="login-brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <h2>EduMongo Portal</h2>
            <p>Student Management System (MongoDB Atlas)</p>
        </div>

        <form id="login-form">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label>Username / Email <span class="required">*</span></label>
                <div style="position: relative;">
                    <input type="text" id="login-username" class="form-control" style="padding-left: 2.5rem;" placeholder="e.g. admin" required>
                    <i class="fa-solid fa-user" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label>Password <span class="required">*</span></label>
                <div style="position: relative;">
                    <input type="password" id="login-password" class="form-control" style="padding-left: 2.5rem;" placeholder="••••••••" required>
                    <i class="fa-solid fa-lock" style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);"></i>
                </div>
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal
            </button>
        </form>

        <div class="demo-credentials">
            <strong>🔑 Demo Presentation Accounts:</strong><br>
            • Admin: <code>admin</code> / <code>admin123</code><br>
            • Faculty: <code>user</code> / <code>user123</code>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                const res = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                showToast(res.message, 'success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 800);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Portal';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Directory | Student Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <div class="brand-text">
                    <h1>EduMongo</h1>
                    <span>Student Portal</span>
                </div>
            </div>

            <ul class="nav-links">
                <li class="nav-item">
                    <a href="/"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></a>
                </li>
                <li class="nav-item">
                    <a href="/students"><i class="fa-solid fa-user-graduate"></i> <span>Students</span></a>
                </li>
                <li class="nav-item active">
                    <a href="/courses"><i class="fa-solid fa-book-open"></i> <span>Courses</span></a>
                </li>
                <li class="nav-item">
                    <a href="/enrollments"><i class="fa-solid fa-id-card"></i> <span>Enrollments</span></a>
                </li>
                <li class="nav-item">
                    <a href="/marks"><i class="fa-solid fa-award"></i> <span>Marks</span></a>
                </li>
                <li class="nav-item">
                    <a href="/attendance"><i class="fa-solid fa-clipboard-user"></i> <span>Attendance</span></a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="db-badge">
                    <div class="db-dot"></div>
                    <span>MongoDB Local</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-wrapper">
            <header class="top-header">
                <div class="header-title">
                    <h2>Course Catalog</h2>
                    <p>Manage curriculum courses, credits, and academic departments</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="openAddCourseModal()">
                        <i class="fa-solid fa-plus"></i> Add Course
                    </button>
                </div>
            </header>

            <div class="page-content">
                <div class="table-card">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Course ID</th>
                                    <th>Course Name</th>
                                    <th>Credits</th>
                                    <th>Department</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="courses-tbody">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add / Edit Course Modal -->
    <div class="modal-overlay" id="course-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="course-modal-title">Add New Course</h3>
                <button class="modal-close" onclick="closeModal('course-modal')">&times;</button>
            </div>
            <form id="course-form">
                <div class="modal-body">
                    <input type="hidden" id="course-is-edit" value="false">
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Course ID <span class="required">*</span></label>
                            <input type="text" id="course_id" class="form-control" placeholder="e.g. CS101" required>
                        </div>

                        <div class="form-group">
                            <label>Course Name <span class="required">*</span></label>
                            <input type="text" id="course_name" class="form-control" placeholder="Database Management Systems" required>
                        </div>

                        <div class="form-group">
                            <label>Credits <span class="required">*</span></label>
                            <input type="number" id="credits" class="form-control" min="1" max="10" value="4" required>
                        </div>

                        <div class="form-group">
                            <label>Department <span class="required">*</span></label>
                            <select id="department" class="form-control" required>
                                <option value="">-- Select Department --</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Mathematics">Mathematics</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('course-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
